onboarding = false
[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical    = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
agent_panel_sort = "priority"

# agent + file explorer layouts (see layout.sh); run from a fresh shell pane
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "$HOME/.config/herdr/layout.sh codex"
description = "codex | yazi"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = "$HOME/.config/herdr/layout.sh claude"
description = "claude | yazi"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "$HOME/.config/herdr/layout.sh claude codex"
description = "claude / codex | yazi"
